<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="robots" content="noindex">
<title>ШТАБ // ПЕРЕХВАТ</title>
<link rel="stylesheet" href="../assets/style.css">
<style>
  .scope { position: relative; border: 2px solid var(--g); background: #010d05; box-shadow: 0 0 18px rgba(0,255,90,.3); }
  canvas { display: block; width: 100%; height: 160px; }
  .lamp { position: absolute; top: 10px; right: 10px; width: 16px; height: 16px; border-radius: 50%;
          background: #063; box-shadow: none; transition: background .03s; }
  .lamp.on { background: var(--g); box-shadow: 0 0 14px 4px var(--g); }
  .status { position: absolute; left: 10px; top: 8px; font-size: 11px; color: var(--gd); }
  .ctrl { display: flex; gap: 8px; margin-top: 12px; flex-wrap: wrap; }
  .ctrl button { flex: 1; background: none; border: 1px solid var(--g); color: var(--g); font: inherit; padding: 12px 6px; cursor: pointer; }
  .ctrl button.on { background: var(--g); color: #000; }
  .tbl { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px 10px; font-size: 15px; margin-top: 8px; }
  .tbl div { display: flex; gap: 8px; }
  .tbl b { width: 1.2em; }
  .tbl span { color: var(--gd); white-space: nowrap; }
  .ans { display: flex; gap: 8px; margin-top: 10px; }
  .ans input { flex: 1; min-width: 0; background: #000; border: 1px solid var(--g); color: var(--g); font: inherit;
               font-size: 20px; padding: 10px; text-transform: uppercase; letter-spacing: 3px; }
  .bad { color: var(--red); }
  .big { font-size: 26px; letter-spacing: 4px; text-shadow: 0 0 10px rgba(0,255,90,.7); margin: 8px 0; }
</style>
</head>
<body>
<div class="wrap">
  <div class="top"><span>SECURE CHANNEL // 03</span><span>MORSE</span></div>

  <h1>ПЕРЕХВАЧЕН СИГНАЛ</h1>
  <div class="sub blink">Источник: Штаб. Передача повторяется</div>

  <div class="scope">
    <canvas id="cv"></canvas>
    <div class="lamp" id="lamp"></div>
    <div class="status" id="st">ОЖИДАНИЕ</div>
  </div>
  <div class="ctrl">
    <button id="play">▶ ПРИНЯТЬ</button>
    <button id="slow">🐢 МЕДЛЕННО</button>
  </div>
  <p class="muted">Короткий сигнал — точка ( · ), длинный — тире ( — ). Между буквами — пауза, перед началом слова — длинная пауза.</p>

  <div class="box">
    <div class="muted">ВВЕДИ РАСШИФРОВКУ</div>
    <div class="ans"><input id="in" autocomplete="off" autocapitalize="characters" spellcheck="false"><button class="act" id="chk">OK</button></div>
    <div id="res" class="muted" style="margin-top:8px;min-height:1.2em"></div>
  </div>

  <div id="win" class="box hidden">
    <div class="muted">ШТАБ → АГЕНТУ Д.</div>
    <p>Сигнал расшифрован верно.</p>
    <div class="big" id="word"></div>
    <p id="after"></p>
  </div>

  <div class="box">
    <div class="muted">ТАБЛИЦА АЗБУКИ МОРЗЕ</div>
    <div class="tbl" id="tbl"></div>
  </div>
</div>
<script src="../assets/common.js"></script>
<script>
// Morse transmitter: WebAudio tone + oscilloscope trace + lamp, looping the hidden word
(() => {
  const MORSE = {"А":".-","Б":"-...","В":".--","Г":"--.","Д":"-..","Е":".","Ж":"...-","З":"--..","И":"..","Й":".---",
    "К":"-.-","Л":".-..","М":"--","Н":"-.","О":"---","П":".--.","Р":".-.","С":"...","Т":"-","У":"..-","Ф":"..-.",
    "Х":"....","Ц":"-.-.","Ч":"---.","Ш":"----","Щ":"--.-","Ъ":"--.--","Ы":"-.--","Ь":"-..-","Э":"..-..","Ю":"..--","Я":".-.-"};
  const K = "m3r8-krabat", W = "vaCioP3JovGywaT9", AFTER = "vaOii/3eotyz41hN483prbvMsdCxwbyzo7QNuvWx17DxvY2igwNLosOy0aTRE6O6/d6i0LPuVL2Joob93l+w5bD2vY1S6Ju7xrDzsPZD";
  const word = D.decode(W, K);

  // Build the morse table
  document.getElementById("tbl").innerHTML = Object.entries(MORSE)
    .map(([k, v]) => `<div><b>${k}</b><span>${v.replace(/\./g, "·").replace(/-/g, "—")}</span></div>`).join("");

  // Timeline of one pass in units: [on, units]
  const seq = [];
  [...word].forEach((ch, li) => {
    [...MORSE[ch]].forEach((s, si) => {
      seq.push([1, s === "." ? 1 : 3]);
      if (si < MORSE[ch].length - 1) seq.push([0, 1]);
    });
    seq.push([0, li < word.length - 1 ? 3 : 14]);
  });
  const passUnits = seq.reduce((a, s) => a + s[1], 0);

  let unit = 0.11, playing = false, ctx = null, gain = null, osc = null, t0 = 0, scheduledUntil = 0, timer = 0;
  const now = () => ctx ? ctx.currentTime : performance.now() / 1000;

  // Is the tone on at absolute time t?
  function stateAt(t) {
    if (!playing || t < t0) return { on: false };
    let u = ((t - t0) / unit) % passUnits, acc = 0, letter = 0;
    for (const [on, d] of seq) { if (u < acc + d) return { on: !!on }; acc += d; }
    return { on: false };
  }

  function schedule() {
    while (scheduledUntil < now() + 1.5) {
      let t = scheduledUntil;
      for (const [on, d] of seq) {
        const dur = d * unit;
        if (on) {
          gain.gain.setValueAtTime(0, t);
          gain.gain.linearRampToValueAtTime(0.35, t + 0.005);
          gain.gain.setValueAtTime(0.35, t + dur - 0.005);
          gain.gain.linearRampToValueAtTime(0, t + dur);
        }
        t += dur;
      }
      scheduledUntil = t;
    }
  }

  function start() {
    if (!ctx) {
      ctx = new (window.AudioContext || window.webkitAudioContext)();
      osc = ctx.createOscillator(); gain = ctx.createGain();
      osc.frequency.value = 650; gain.gain.value = 0;
      osc.connect(gain).connect(ctx.destination); osc.start();
    }
    ctx.resume();
    gain.gain.cancelScheduledValues(0); gain.gain.setValueAtTime(0, now());
    t0 = now() + 0.6; scheduledUntil = t0; playing = true;
    schedule(); clearInterval(timer); timer = setInterval(schedule, 400);
    document.getElementById("play").textContent = "■ СТОП";
  }
  function stop() {
    playing = false; clearInterval(timer);
    if (gain) { gain.gain.cancelScheduledValues(0); gain.gain.setValueAtTime(0, now()); }
    document.getElementById("play").textContent = "▶ ПРИНЯТЬ";
  }
  document.getElementById("play").onclick = () => playing ? stop() : start();
  document.getElementById("slow").onclick = (e) => {
    unit = unit === 0.11 ? 0.22 : 0.11;
    e.target.classList.toggle("on", unit === 0.22);
    if (playing) { stop(); start(); }
  };

  // Oscilloscope rendering
  const cv = document.getElementById("cv"), g = cv.getContext("2d"), lamp = document.getElementById("lamp"), st = document.getElementById("st");
  function draw() {
    const dpr = window.devicePixelRatio || 1, w = cv.clientWidth, h = cv.clientHeight;
    if (cv.width !== w * dpr) { cv.width = w * dpr; cv.height = h * dpr; }
    g.setTransform(dpr, 0, 0, dpr, 0, 0);
    g.clearRect(0, 0, w, h);
    g.strokeStyle = "rgba(0,168,59,.25)"; g.lineWidth = 1;
    for (let x = 0; x < w; x += w / 10) { g.beginPath(); g.moveTo(x, 0); g.lineTo(x, h); g.stroke(); }
    for (let y = 0; y < h; y += h / 6) { g.beginPath(); g.moveTo(0, y); g.lineTo(w, y); g.stroke(); }
    const tn = now(), span = 26 * unit, mid = h / 2;
    g.strokeStyle = "#00ff5a"; g.lineWidth = 2; g.shadowColor = "#00ff5a"; g.shadowBlur = 8;
    g.beginPath();
    for (let x = 0; x <= w; x++) {
      const t = tn - span * (1 - x / w);
      const on = stateAt(t).on;
      const y = (on ? mid - h * 0.32 : mid + h * 0.12) + (Math.random() - 0.5) * 2;
      x ? g.lineTo(x, y) : g.moveTo(x, y);
    }
    g.stroke(); g.shadowBlur = 0;
    const on = stateAt(tn).on;
    lamp.classList.toggle("on", on);
    st.textContent = !playing ? "ОЖИДАНИЕ" : (tn < t0 ? "СИНХРОНИЗАЦИЯ…" : "ПРИЁМ " + (unit > 0.15 ? "×0.5" : "×1"));
    requestAnimationFrame(draw);
  }
  requestAnimationFrame(draw);

  // Answer check
  const norm = s => s.toUpperCase().replace(/Ё/g, "Е").replace(/[^А-Я]/g, "");
  function win(instant) {
    document.getElementById("win").classList.remove("hidden");
    document.getElementById("word").textContent = word;
    const a = document.getElementById("after"), txt = D.decode(AFTER, K);
    instant ? (a.textContent = txt) : D.type(a, txt);
    try { localStorage.setItem("dday-m3r8", "1"); } catch (e) {}
  }
  function check() {
    const res = document.getElementById("res");
    if (norm(document.getElementById("in").value) === norm(word)) {
      res.className = "muted"; res.textContent = "✔ ДОСТУП РАЗРЕШЁН"; stop(); win(false);
    } else {
      res.className = "bad"; res.textContent = "✖ НЕВЕРНО. Слушай ещё раз.";
    }
  }
  document.getElementById("chk").onclick = check;
  document.getElementById("in").addEventListener("keydown", e => { if (e.key === "Enter") check(); });
  let saved = null; try { saved = localStorage.getItem("dday-m3r8"); } catch (e) {}
  if (saved) win(true);
})();
</script>
</body>
</html>
